mixed-port: 7891
allow-lan: false
mode: rule
log-level: info
ipv6: false

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
  direct-nameserver:
    - system
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8
proxies:
  - name: Hermes-Hysteria2-Fast
    type: hysteria2
    server: 89.40.70.42
    port: 443
    password: 2cd4db45d95fadfe2eb42ae29234f219b40bf8c47d677aca
    sni: 222468.com
    skip-cert-verify: true
    udp: true
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Hermes-Hysteria2-Fast
      - DIRECT

  - name: RU-DIRECT
    type: select
    proxies:
      - DIRECT
      - Hermes-Hysteria2-Fast

rule-providers:
  ru-bank:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/category-bank-ru.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-bank-ru.mrs"
    interval: 86400
    proxy: PROXY

  ru-ecommerce:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/category-ecommerce-ru.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ecommerce-ru.mrs"
    interval: 86400
    proxy: PROXY

  ru-entertainment:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/category-entertainment-ru.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-entertainment-ru.mrs"
    interval: 86400
    proxy: PROXY

  ru-ai:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/category-ai-ru.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-ru.mrs"
    interval: 86400
    proxy: PROXY

  avito:
    type: http
    behavior: domain
    format: mrs
    path: ./ruleset/avito.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/avito.mrs"
    interval: 86400
    proxy: PROXY

  ru-ip:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./ruleset/ru-ip.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/ru.mrs"
    interval: 86400
    proxy: PROXY

rules:
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve

  - DOMAIN-SUFFIX,ru,RU-DIRECT
  - DOMAIN-SUFFIX,su,RU-DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,RU-DIRECT

  - DOMAIN,ipv6-internet.yandex.net,REJECT
  - DOMAIN-SUFFIX,ya.ru,RU-DIRECT
  - DOMAIN-SUFFIX,yandex.ru,RU-DIRECT
  - DOMAIN-SUFFIX,yandex.net,RU-DIRECT
  - DOMAIN-SUFFIX,yastatic.net,RU-DIRECT
  - DOMAIN-SUFFIX,yandex.com,RU-DIRECT
  - RULE-SET,ru-bank,RU-DIRECT
  - RULE-SET,ru-ecommerce,RU-DIRECT
  - RULE-SET,ru-entertainment,RU-DIRECT
  - RULE-SET,ru-ai,RU-DIRECT
  - RULE-SET,avito,RU-DIRECT
  - RULE-SET,ru-ip,RU-DIRECT,no-resolve

  - MATCH,PROXY

